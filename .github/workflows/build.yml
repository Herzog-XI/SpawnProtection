name: Build SpawnProtection

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: nuget restore SpawnProtection/SpawnProtection.csproj

      - name: Build
        run: msbuild SpawnProtection/SpawnProtection.csproj /p:Configuration=Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: SpawnProtection
          path: SpawnProtection/bin/Release/SpawnProtection.dll
